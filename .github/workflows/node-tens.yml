name: 'Tests: node.js 10 - 20'

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 16, 14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm config set registry 'https://:2026-08-29T23%3A50%3A15.803000Z@time-machines-npm.sealsecurity.io/'
      - run: npm install
      - run: npm run tests-only

  node:
    name: 'node 10 - 20'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: true
